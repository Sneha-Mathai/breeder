<style>
    .registration-form {
        max-width: 600px;
        margin: 0 auto;
        padding: 20px;
        background-color: #f5f5f5;
        border: 1px solid #ddd;
        border-radius: 5px;
    }

    .registration-form .form-input {
        margin-bottom: 20px;
    }

    .registration-form input[type="text"],
    .registration-form input[type="number"],
    .registration-form select,
    .registration-form textarea {
        width: 100%;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 3px;
    }



    .registration-form .btn {
        padding: 10px 20px;
        font-size: 16px;
        background-color: #007bff;
        color: #fff;
        border: none;
        border-radius: 3px;
        cursor: pointer;
    }

    .registration-form .btn:hover {
        background-color: #0069d9;
    }
</style>

<div class="registration-form">
    <form method="post" class="signin-form" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="form-input">
            <input type="text" name="name" id="dog_name" placeholder="Dog's name">
        </div>
        <label for="gender">Gender:</label>

        <input class="form-check-input" type="radio" name="gender" id="male" value="male" required>male
        <input class="form-check-input" type="radio" name="gender" id="female" value="female" required>female
<br><br>
        <div class="form-input">
            <select name="breed" id="dog_breed">
                <option value="" disabled selected>Select dog's breed</option>
                <option value="German Shepherd">German Shepherd</option>
                <option value="Pug">Pug</option>
                <option value="Labrador Retriever">Labrador Retriever</option>
                <option value="Bulldog">Bulldog</option>
                <option value="Beagle">Beagle</option>
                <option value="Boxer">Boxer</option>
                <option value="Golden Retriever">Golden Retriever</option>
                <option value="Dachshund">Dachshund</option>
                <option value="Chihuahua">Chihuahua</option>
                <option value="Siberian Husky">Siberian Husky</option>
            </select>
        </div>
      

                <label for="gender">Taking medication:</label>

                <input class="form-check-input" type="radio" name="medication" id="male" value="yes" required>yes
                <input class="form-check-input" type="radio" name="medication" id="female" value="no" required>no
                <br><br>
        <!-- <div class="form-input">
            <input type="text" name="age" id="dog_age" placeholder="Dog's age">
        </div> -->
        <div class="form-input">
            <input type="file" name="image" >
        </div>
        <div class="form-input">
            <textarea name="description" id="dog_description" placeholder="Dog's description" rows="4"></textarea>
        </div>
        <div class="text-right">
            <button type="submit" style="background-color: #dc3545;        padding: 10px 20px;
            font-size: 16px;
           
            color: #fff;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            
 " class="btn btn-primary">Submit</button>
        </div>
    </form>
</div>
