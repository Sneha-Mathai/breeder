<style>
    .mail {
        padding: 50px 0;
        background-color: #f5f5f5;
    }

    .mail h2 {
        font-size: 24px;
        color: #333;
        margin-bottom: 30px;
    }

    .mail-grids {
        background-color: #fff;
        padding: 30px;
        border-radius: 5px;
        box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
    }

    .mail-grid-left1 h3 {
        font-size: 18px;
        color: #333;
        margin-bottom: 20px;
    }

    .mail-grid-left1 input[type="text"],
    .mail-grid-left1 input[type="tel"],
    .mail-grid-left1 input[type="month"] {
        flex: 1;
        padding: 10px;
        height: 44px;
        width: 100%;
        background-color:#ccc;
        font-family: Arial, sans-serif;
        margin-bottom: 15px;
    }

    .mail-grid-left1 input[type="submit"] {
        padding: 10px 20px;
        font-size: 16px;
        background-color: #007bff;
        color: #fff;
        border: none;
        border-radius: 3px;
        cursor: pointer;
    }

    .mail-grid-left1 input[type="submit"]:hover {
        background-color: #0069d9;
    }
    .message {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
    }

    .sender-name {
        color: #0078D4; /* Replace with the desired color for the sender's name */
        font-weight: bold;
        margin-bottom: 5px;
    }

    .clearfix {
        clear: both;
    }
</style>

<div class="mail">
    <div class="container">
        <center>
            <h2>View Chat</h2>
        </center>
        <center>
            <div class="mail-grids" style="width: 1000px; ">
                <div class="col-md-6 mail-grid-left">
                    <div class="mail-grid-left1">
                        {% for data in res %}
                        <div class="message">
                            <div class="sender-name">
                                {{data.customer.name}}
                            </div>
                            <div class="chat-box" style="min-width: 100px; align-self: flex-end; padding: 10px; border: 1px solid #ccc; border-radius: 10px; margin-left: 30px; background-color: #f2f2f2; margin-bottom: 5px;">
                                {{ data.message }}
                            </div>
                        </div>
                            <form method="post">
                                {% csrf_token %}
                                <input type="hidden" name="did" value="{{ data.id }}">
                                <div class="chat-container" style="        display: flex;
                                align-items: flex-start;
                                margin-bottom: 10px;">
                                <input type="text" name="reply" style="border: none;" placeholder="Enter reply" required>
                                <button type="submit" style="background-color: #ccc; padding: 10px 20px; font-size: 16px; color: #fff; border: none; cursor: pointer;">
                                    <i class="fa fa-paper-plane" aria-hidden="true" style="color: #d90000;"></i>
                                </button></div>
                            </form>
                        {% endfor %}
                    </div>
                </div>
            </div>
        </center>
    </div>
</div>


    {% endblock %}
